name: Photos

# Keeps the photo buckets in step with photos/*.ndjson on main: copies newly
# published photos from the private pending bucket to the serving bucket,
# takes hidden ones and photos from blocked contributors out of it, and
# deletes every photo on moderation/removed_photos.json from both. Runs after
# each merge that touches them and once a day. See pipeline/photos.py.
on:
  push:
    branches: [main]
    paths:
      - "photos/**"
      - "moderation/removed_photos.json"
      - "moderation/blocked_contributors.json"
  schedule:
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the photo buckets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pipeline.photos --root .
