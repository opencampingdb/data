name: OSM sync

# Daily at 02:00 UTC (12:00 or 13:00 in Melbourne and Sydney), within an hour
# of Geofabrik publishing the day's extract (about 01:20 UTC). Downloads the
# Geofabrik extract for Australia (tools/download-extract, which falls back to
# the OpenStreetMap France mirror when Geofabrik refuses the runner), merges
# it into places/, rewrites the
# MapRoulette challenge files in maproulette/ and opens or updates one pull
# request from the osm-sync branch. Auto-merge is turned on only when
# fewer than 2% of records changed.
#
# Report tasks need the evidence behind them, so the run checks out the
# applied/ folder of the private inbox repository with a read-only token for
# the same App. Nothing from the inbox is committed: only counts and dates
# reach maproulette/, and the checkout is deleted before the PR step.
#
# The branch push, the PR and the merge use a token for the opencampingdb-bot
# GitHub App, never GITHUB_TOKEN: events caused by GITHUB_TOKEN do not start
# other workflows, so a PR opened with it would never get its Validate check.
# See README.md, "Repository setup".
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-sync
  cancel-in-progress: false

env:
  USER_AGENT: OpenCampingDB-pipeline (+https://github.com/opencampingdb/data)

jobs:
  # The timed start comes from the feedback intake through workflow_dispatch.
  # The schedule above is a backup, so a scheduled run does nothing when a run
  # started another way (the intake, a push or by hand) is queued, running or
  # succeeded in the last 1440 minutes. Scheduled runs are not counted, so
  # a skipped backup never makes the next backup skip. If the check fails,
  # the run goes ahead.
  due:
    name: Check if due
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check for a run in this slot
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: sync-osm.yml
          WINDOW_MINUTES: "1440"
        run: |
          run=true
          why="started by $GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since=$(date -u -d "$WINDOW_MINUTES minutes ago" +%Y-%m-%dT%H:%M:%SZ)
            if runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs" \
                -f created=">=$since" -f per_page=100 --jq .workflow_runs); then
              other=$(jq -r --argjson self "$GITHUB_RUN_ID" '[.[]
                | select(.id != $self and .event != "schedule")
                | select(.status != "completed" or .conclusion == "success")][0]
                | if . then "run \(.id) (\(.event), \(.conclusion // .status))" else "" end' <<< "$runs")
              if [ -n "$other" ]; then
                run=false
                why="skipped, $other since $since"
              else
                why="no other run since $since"
              fi
            else
              why="could not list runs, running anyway"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice::run=$run, $why"

  sync:
    needs: due
    if: needs.due.outputs.run == 'true'
    name: Sync from OpenStreetMap
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Soft fail on an npm outage: out_of_spec keeps the last file and the report says "Not built".
      - name: Set up Node for opening_hours.js
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/oh-check/.node-version

      - name: Install opening_hours.js
        continue-on-error: true
        run: npm ci --ignore-scripts --prefix tools/oh-check

      - name: Download the Australia extract
        run: |
          set -euo pipefail
          tools/download-extract "$RUNNER_TEMP"

      - name: Extract camping places
        run: |
          python -m pipeline.extract "$RUNNER_TEMP/australia-latest.osm.pbf" --out "$RUNNER_TEMP/extract.ndjson" \
            --geometry "$RUNNER_TEMP/geometry.ndjson" --localities localities/localities.ndjson

      - name: Merge into places/
        run: |
          set -euo pipefail
          python -m pipeline.sync "$RUNNER_TEMP/extract.ndjson" --root . \
            --report "$RUNNER_TEMP/sync-report.md" \
            --summary "$RUNNER_TEMP/sync-summary.json" \
            --geometry "$RUNNER_TEMP/geometry.ndjson" \
            --osm-history \
            --source "$(cat "$RUNNER_TEMP/extract-source.txt") australia extract, downloaded $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Create a read-only inbox token
        id: inbox-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OCDB_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OCDB_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: inbox
          permission-contents: read

      - name: Check out the inbox's applied feedback
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/inbox
          token: ${{ steps.inbox-token.outputs.token }}
          path: .inbox
          sparse-checkout: applied
          persist-credentials: false

      - name: Write the MapRoulette challenge files
        run: |
          python -m pipeline.maproulette "$RUNNER_TEMP/extract.ndjson" --root . \
            --geometry "$RUNNER_TEMP/geometry.ndjson" \
            --inbox .inbox --report "$RUNNER_TEMP/sync-report.md"

      - name: Remove the inbox checkout
        if: always()
        run: rm -rf .inbox

      - name: Validate
        run: python -m pipeline.validate --root .

      - name: Create an opencampingdb-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OCDB_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OCDB_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- places reviews overture osm maproulette localities)" ]; then
            echo "No record, challenge or localities file changed. Nothing to propose."
            exit 0
          fi

          gh auth setup-git
          # Commit as the App's bot user, with GitHub's no-reply address for it.
          bot_id="$(gh api '/users/opencampingdb-bot%5Bbot%5D' --jq .id)"
          git config user.name "opencampingdb-bot[bot]"
          git config user.email "${bot_id}+opencampingdb-bot[bot]@users.noreply.github.com"

          # The branch is rebuilt from main every night, so the PR always
          # shows main plus tonight's sync and nothing older.
          # Stop rather than overwrite an osm-sync PR that someone else opened
          # from this repository.
          other="$(gh pr list --head osm-sync --base main --state open \
            --json number,isCrossRepository,author \
            --jq '[.[] | select(.isCrossRepository == false and .author.login != "app/opencampingdb-bot" and .author.login != "opencampingdb-bot[bot]")][0].number // empty')"
          if [ -n "$other" ]; then
            echo "::error::PR #${other} uses the osm-sync branch but was not opened by the bot"
            exit 1
          fi

          git switch -C osm-sync
          git add -- places reviews overture osm maproulette localities
          git commit -q -m "chore(osm): sync places from OpenStreetMap $(date -u +%Y-%m-%d)"
          git push --force origin HEAD:osm-sync

          title="OSM sync $(date -u +%Y-%m-%d)"
          # Only the bot's own PR from this repository's osm-sync branch counts.
          # A PR from a fork can use the same branch name.
          number="$(gh pr list --head osm-sync --base main --state open \
            --json number,isCrossRepository,author \
            --jq '[.[] | select(.isCrossRepository == false and (.author.login == "app/opencampingdb-bot" or .author.login == "opencampingdb-bot[bot]"))][0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --base main --head osm-sync --title "$title" --body-file "$RUNNER_TEMP/sync-report.md")"
            number="${url##*/}"
          else
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/sync-report.md"
          fi

          auto_merge="$(python -c 'import json, sys; print(str(json.load(open(sys.argv[1]))["auto_merge"]).lower())' "$RUNNER_TEMP/sync-summary.json")"
          if [ "$auto_merge" = "true" ]; then
            gh pr merge "$number" --auto --squash
          else
            # A big change waits for a person, even if last night's run had
            # turned auto-merge on for this PR.
            gh pr merge "$number" --disable-auto || true
          fi
