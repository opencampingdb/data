name: Validate

# Runs on every pull request, including the nightly OSM sync PR and the
# feedback PRs. This job's name is the check that branch protection on main
# should require, so that auto-merge waits for it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node for opening_hours.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/oh-check/.node-version

      - name: Install opening_hours.js
        run: npm ci --ignore-scripts --prefix tools/oh-check

      - name: Run tests
        env:
          # The opening hours tests fail here, rather than skip, without node.
          REQUIRE_NODE: "1"
        run: python -m pytest

      - name: Validate place and review files
        run: python -m pipeline.validate --root .

      - name: Build release files and the database (not published)
        run: |
          python -m pipeline.release --root . --out dist
          python -m pipeline.database --release-dir dist
          ls -l dist
