name: Release

# On every push to main, and every hour as a backstop (GitHub delays and
# sometimes drops scheduled runs), if main has changed since the newest
# release, builds the release files and publishes them as a new release
# tagged data-<YYYYMMDDTHHMMSSZ> (the commit time), marked as the
# repository's Latest release. The stable URL
# https://github.com/opencampingdb/data/releases/latest/download/manifest.json
# therefore always serves the newest manifest, and the url fields in that
# manifest point at the files in the same release. Only the newest 60 dated
# releases are kept. Older ones are deleted together with their tags.
#
# After each release it loads the place index (dist/place-index.ndjson.gz, not
# a release file) into a feedback intake, when the INTAKE_URL variable (or the
# intake_url input of a manual run) and the INTAKE_PLACES_TOKEN secret, the
# intake's PLACES_TOKEN, are set, and then tells the intake the new release's
# data_version and layout_version (POST /v1/release), so its recent list
# names the newest release. Without them both steps are skipped. The intake
# address must be https and have the host of the INTAKE_URL variable, so the
# token goes only to the configured intake, and neither step follows a
# redirect. The write token (GH_TOKEN) is given only to the steps that call gh.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      intake_url:
        description: "Intake base URL for the place index, https on the INTAKE_URL variable's host (default: the INTAKE_URL variable)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  KEEP_RELEASES: "60"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      INTAKE_URL: ${{ inputs.intake_url || vars.INTAKE_URL }}
      CONFIGURED_INTAKE_URL: ${{ vars.INTAKE_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check whether main changed since the newest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          newest="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^data-' | sort -r | head -n 1 || true)"
          released=""
          if [ -n "$newest" ]; then
            released="$(gh api "repos/$GH_REPO/commits/$newest" --jq .sha)"
          fi
          if [ "$released" = "$head" ]; then
            echo "main is at $head, already released as $newest. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $head, newest release is ${newest:-none}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Validate
        if: steps.check.outputs.changed == 'true'
        run: python -m pipeline.validate --root .

      - name: Build release files
        if: steps.check.outputs.changed == 'true'
        run: python -m pipeline.release --root . --out dist --repository "$GH_REPO"

      # ocdb.sqlite.gz, the release as an SQLite database, and changesets to it
      # from the databases of the release just before and of the last release
      # of the previous UTC day (pipeline/database.py). A release without a
      # database gives no changeset, and apps download the whole database.
      #
      # The earlier releases are chosen only from releases this workflow
      # published (author github-actions[bot], not a draft), made before this
      # one, whose tag is on main's history. A release or tag made any other
      # way is never read, so its manifest cannot pass changeset entries on.
      - name: Build the database and changesets
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          earlier="$RUNNER_TEMP/earlier"
          head="$(git rev-parse HEAD)"
          version="$(python -c 'import json; print(json.load(open("dist/manifest.json"))["data_version"])')"
          ours="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.author.login == "github-actions[bot]" and (.draft | not)) | .tag_name' \
            | python -m pipeline.database --previous-base "$version")"
          tags=""
          while read -r tag; do
            [ -n "$tag" ] || continue
            status="$(gh api "repos/$GH_REPO/compare/$tag...$head" --jq .status 2>/dev/null || true)"
            if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
              tags+="$tag"$'\n'
            else
              echo "Skipping $tag: its tag is not on main's history (${status:-no comparison})."
            fi
          done <<<"$ours"
          fetch() {
            mkdir -p "$earlier/$2"
            assets="$(gh release view "$1" --json assets --jq '.assets[].name')"
            if grep -qx 'ocdb.sqlite.gz' <<<"$assets"; then
              gh release download "$1" --dir "$earlier/$2" --pattern manifest.json --pattern ocdb.sqlite.gz
            else
              echo "$1 has no database."
            fi
          }
          args=()
          previous="$(printf '%s\n' "$tags" | head -n 1)"
          if [ -n "$previous" ]; then
            fetch "$previous" previous
            args+=(--previous "$earlier/previous")
          fi
          day="$(printf '%s\n' "$tags" | python -m pipeline.database --day-base "$version")"
          if [ -n "$day" ] && [ "$day" != "$previous" ]; then
            fetch "$day" day
            args+=(--day "$earlier/day")
          fi
          python -m pipeline.database --release-dir dist --root . --repository "$GH_REPO" "${args[@]}"

      - name: Publish
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          changesets=(dist/changeset-*.bin.gz)
          tag="$(python -c 'import json; print(json.load(open("dist/manifest.json"))["release"])')"
          version="$(python -c 'import json; print(json.load(open("dist/manifest.json"))["data_version"])')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to publish."
            exit 0
          fi
          notes="Open Camping DB data version ${version}. Licence: ODbL 1.0 (database), DbCL 1.0 (contents). Attribution: © OpenStreetMap contributors, Open Camping DB."
          gh release create "$tag" dist/manifest.json dist/places.ndjson.gz dist/reviews.ndjson.gz dist/merged.ndjson.gz dist/commons.ndjson.gz \
            dist/ocdb.sqlite.gz "${changesets[@]}" \
            --target "$(git rev-parse HEAD)" --title "$tag" --notes "$notes" --latest

      - name: Keep only the newest dated releases
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep '^data-' || true; } | sort -r | tail -n "+$((KEEP_RELEASES + 1))" \
            | while read -r old; do
                echo "Deleting release and tag $old"
                gh release delete "$old" --cleanup-tag --yes
              done

      # Refuses an address that is not https on the INTAKE_URL variable's host,
      # before any step holds the token.
      - name: Check the intake address
        id: intake
        if: steps.check.outputs.changed == 'true' && env.INTAKE_URL != ''
        run: |
          set -euo pipefail
          base="$(python -m pipeline.place_index --check --url "$INTAKE_URL" --configured-url "$CONFIGURED_INTAKE_URL")"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Load the place index into the intake
        if: steps.check.outputs.changed == 'true' && steps.intake.outputs.base != ''
        env:
          INTAKE_PLACES_TOKEN: ${{ secrets.INTAKE_PLACES_TOKEN }}
          INTAKE_BASE: ${{ steps.intake.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "$INTAKE_PLACES_TOKEN" ]; then
            echo "INTAKE_PLACES_TOKEN is not set. Skipping the place index."
            exit 0
          fi
          python -m pipeline.place_index --file dist/place-index.ndjson.gz --url "$INTAKE_BASE" --configured-url "$CONFIGURED_INTAKE_URL"

      - name: Tell the intake the newest release
        if: steps.check.outputs.changed == 'true' && steps.intake.outputs.base != ''
        env:
          INTAKE_PLACES_TOKEN: ${{ secrets.INTAKE_PLACES_TOKEN }}
          INTAKE_BASE: ${{ steps.intake.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "$INTAKE_PLACES_TOKEN" ]; then
            echo "INTAKE_PLACES_TOKEN is not set. Skipping the release announcement."
            exit 0
          fi
          body="$(python -c 'import json; m = json.load(open("dist/manifest.json")); print(json.dumps({k: m[k] for k in ("data_version", "layout_version") if k in m}))')"
          # The intake's answer is printed between stop-commands markers, so a line
          # in it cannot act as a workflow command.
          show_answer() {
            marker="$(python -c 'import secrets; print(secrets.token_hex(16))')"
            echo "::stop-commands::$marker"
            cat response.json
            echo
            echo "::$marker::"
          }
          status="$(curl -sS --proto =https --max-redirs 0 -o response.json -w '%{http_code}' -X POST "$INTAKE_BASE/v1/release" \
            -H "authorization: Bearer $INTAKE_PLACES_TOKEN" -H "content-type: application/json" --data "$body")"
          if [ "$status" = "404" ]; then
            echo "::notice::The intake has no POST /v1/release yet. Skipping the release announcement."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::The intake answered $status to the release announcement."
            show_answer
            exit 1
          fi
          show_answer
